name: Release

# Every push to main refreshes the release PR. Merging that PR creates the tag
# and the GitHub release, and the jobs below then build, test and publish it.
# See docs/RELEASING.md.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with the default token does not trigger other workflows, so
      # CI would never run on the release PR. RELEASE_PLEASE_TOKEN, when set,
      # opens it as a real identity and CI runs.
      - name: Open or update the release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build:
    name: Build and smoke test
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the published bundle
        run: npm run build:dist

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Smoke test the tarball
        run: node scripts/smoke-test.mjs "$RUNNER_TEMP"/pack/cc-tap-*.tgz

      - name: Keep the tarball for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/pack/cc-tap-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # The npm environment asks a named reviewer to approve before this job runs.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing signs in with this, no token stored
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Fetch the tested tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: pack

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Check the npm version
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error("npm is too old for trusted publishing"); process.exit(1) }' "$(npm --version)"

      # The exact file the smoke test ran is what gets published.
      - name: Publish
        run: npm publish pack/cc-tap-*.tgz --access public --ignore-scripts
