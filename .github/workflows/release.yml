name: Release

# Every push to main refreshes the release PR. Merging that PR creates the tag
# and the GitHub release, and the jobs below then build, test and publish it.
# See docs/RELEASING.md.

on:
  push:
    branches:
      - main
  # Publishes a tag that already exists, for a release whose publish failed.
  # A re-run of the failed job would use the workflow as it was at that commit.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, such as v0.12.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with the default token does not trigger other workflows, so
      # CI would never run on the release PR. RELEASE_PLEASE_TOKEN, when set,
      # opens it as a real identity and CI runs.
      - name: Open or update the release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build:
    name: Build and smoke test
    needs: release-please
    # release-please is skipped on a manual run, so do not inherit its skip.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check the tag name
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Expected a tag like v0.12.0, got: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check that package.json matches the tag
        run: test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the published bundle
        run: npm run build:dist

      # npm pack does not create its destination directory.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Smoke test the tarball
        run: node scripts/smoke-test.mjs "$RUNNER_TEMP"/pack/cc-tap-*.tgz

      - name: Keep the tarball for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/pack/cc-tap-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # The npm environment asks a named reviewer to approve before this job runs.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing signs in with this, no token stored
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # This job has no checkout, so there is nothing to cache.
          package-manager-cache: false

      - name: Fetch the tested tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: pack

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Check the npm version
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error("npm is too old for trusted publishing"); process.exit(1) }' "$(npm --version)"

      # The exact file the smoke test ran is what gets published. The leading ./
      # matters: npm reads a bare "pack/x.tgz" as the GitHub repository pack/x.tgz.
      - name: Publish
        run: npm publish ./pack/cc-tap-*.tgz --access public --ignore-scripts

  verify:
    name: Verify on npm
    needs: [release-please, build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # npm points "latest" at a new version a few minutes before the version
      # can be installed. Ask the way a user's npm does, and only fetch the
      # tarball once the version is listed: a tarball requested too early gets
      # a "not found" that the registry caches for five minutes.
      - name: Wait for npm to list the version
        run: |
          version="${RELEASE_TAG#v}"
          start=$(date +%s)
          until npm view "cc-tap@$version" version --prefer-online >/dev/null 2>&1; do
            waited=$(( $(date +%s) - start ))
            if [ "$waited" -ge 900 ]; then
              echo "::error::npm still does not list cc-tap@$version after 15 minutes"
              exit 1
            fi
            sleep 15
          done
          waited=$(( $(date +%s) - start ))
          echo "cc-tap@$version listed ${waited}s after this job started"
          echo "npm listed \`cc-tap@$version\` ${waited}s after the publish job ended." >> "$GITHUB_STEP_SUMMARY"

      - name: Download the published tarball
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          cd "$RUNNER_TEMP/published"
          for attempt in 1 2 3 4 5 6; do
            npm pack "cc-tap@${RELEASE_TAG#v}" --prefer-online && exit 0
            sleep 30
          done
          echo "::error::npm lists the version but its tarball cannot be downloaded"
          exit 1

      - name: Fetch the tarball CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: built

      - name: Check npm serves the file CI built
        run: |
          built=$(sha256sum built/cc-tap-*.tgz | cut -d' ' -f1)
          published=$(sha256sum "$RUNNER_TEMP"/published/cc-tap-*.tgz | cut -d' ' -f1)
          echo "built:     $built"
          echo "published: $published"
          test "$built" = "$published"

      - name: Smoke test the published tarball
        run: node scripts/smoke-test.mjs "$RUNNER_TEMP"/published/cc-tap-*.tgz
