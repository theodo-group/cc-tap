name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      # PRs are squash-merged, so the title becomes the commit on main, and
      # release-please reads that commit to pick the version and write the changelog.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must look like 'feat(scope): summary' or 'fix: summary'. Got: $TITLE"
            echo "Allowed types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert."
            exit 1
          fi
